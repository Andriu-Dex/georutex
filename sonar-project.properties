# ==============================================================================
# GeoRutex — SonarQube Scanner Configuration
# Analyzes project-owned code only, strictly excluding vendor code and evidence.
# ==============================================================================

sonar.projectKey=georutex
sonar.projectName=GeoRutex - Sistema de Monitoreo y Evaluacion de Rutas
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=addons/uta_transport_monitor
sonar.tests=tests,addons/uta_transport_monitor/tests

# Inclusions: project-owned Python and Owl/JavaScript code
sonar.inclusions=addons/uta_transport_monitor/**/*.py,addons/uta_transport_monitor/static/src/**/*.js

# Exclusions: vendor libraries, demo fixtures, caches, private evidence, tests from sources
sonar.exclusions=addons/uta_transport_monitor/tests/**,addons/uta_transport_monitor/static/lib/**,**/__pycache__/**,addons/uta_transport_monitor/demo/**,evidence/**,docs/**,infra/**,scripts/**

# Test and coverage reporting
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

