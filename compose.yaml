services:
  postgres:
    image: postgres:15-alpine
    container_name: georutex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-georutex}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_password}
    ports:
      # Restrict to localhost to avoid exposure on public/LAN interfaces
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-georutex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - georutex_net

  odoo:
    image: odoo:16.0
    container_name: georutex-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ODOO_BIND_ADDRESS:-0.0.0.0}:${ODOO_HTTP_PORT:-8069}:8069"
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_password}
      DB_NAME: ${ODOO_DB_NAME:-${POSTGRES_DB:-georutex}}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-base,uta_transport_monitor}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${SMTP_PASS:-}}
      SMTP_FROM: ${SMTP_FROM:-}
      TRACCAR_API_BASE_URL: ${TRACCAR_API_BASE_URL:-http://traccar:8082}
      TRACCAR_API_USERNAME: ${TRACCAR_API_USERNAME:-}
      TRACCAR_API_PASSWORD: ${TRACCAR_API_PASSWORD:-}
    entrypoint: ["python3", "/usr/local/bin/georutex-entrypoint.py"]
    command: ["odoo", "--db-filter=^georutex$$"]
    volumes:
      - ./addons:/mnt/extra-addons
      - ./infra/odoo/odoo.conf:/etc/odoo/odoo.conf
      - ./infra/odoo/entrypoint.py:/usr/local/bin/georutex-entrypoint.py:ro
      - odoo_web_data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/georutex/acceso', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - georutex_net

  traccar:
    image: traccar/traccar:6.5
    container_name: georutex-traccar
    restart: unless-stopped
    ports:
      # GPS ingestion port for mobile Traccar Client via secure local tunnel
      - "127.0.0.1:${TRACCAR_OSMAND_PORT:-5055}:5055"
    volumes:
      - ./infra/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
    networks:
      - georutex_net

  postgres-test:
    image: postgres:15-alpine
    container_name: georutex-postgres-test
    profiles:
      - test
    environment:
      POSTGRES_DB: georutex_test
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d georutex_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - georutex_net

  odoo-test:
    build:
      context: .
      dockerfile: infra/odoo/Dockerfile
    container_name: georutex-odoo-test
    profiles:
      - test
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      HOST: postgres-test
      PORT: 5432
      USER: odoo
      PASSWORD: odoo_test_password
      COVERAGE_FILE: /tmp/.coverage
    volumes:
      - ./addons:/mnt/extra-addons
      - ./tests:/workspace/tests
      - ./pytest.ini:/workspace/pytest.ini
      - ./infra/odoo/odoo.conf:/etc/odoo/odoo.conf
    working_dir: /tmp
    command: python3 -m pytest -c /workspace/pytest.ini /workspace/tests/unit --cov=odoo.addons.uta_transport_monitor.domain --cov=odoo.addons.uta_transport_monitor.integrations --cov-report=term-missing
    networks:
      - georutex_net

networks:
  georutex_net:
    driver: bridge

volumes:
  odoo_db_data:
  odoo_web_data:
  traccar_data:
  traccar_logs:
