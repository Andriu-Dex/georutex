services:
  postgres:
    image: postgres:15-alpine
    container_name: georutex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-georutex}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_password}
    ports:
      # Restrict to localhost to avoid exposure on public/LAN interfaces
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-georutex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - georutex_net

  odoo:
    image: odoo:16.0
    container_name: georutex-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_password}
    volumes:
      - ./addons:/mnt/extra-addons
      - ./infra/odoo/odoo.conf:/etc/odoo/odoo.conf
      - odoo_web_data:/var/lib/odoo
    networks:
      - georutex_net

  traccar:
    image: traccar/traccar:6.5
    container_name: georutex-traccar
    restart: unless-stopped
    ports:
      # Restrict admin console and private REST API to localhost
      - "127.0.0.1:${TRACCAR_WEB_PORT:-8082}:8082"
      # OsmAnd GPS HTTP ingestion port for mobile Traccar Client via secure local tunnel
      - "127.0.0.1:${TRACCAR_OSMAND_PORT:-5055}:5055"
    volumes:
      - ./infra/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
    networks:
      - georutex_net

  postgres-test:
    image: postgres:15-alpine
    container_name: georutex-postgres-test
    profiles:
      - test
    environment:
      POSTGRES_DB: georutex_test
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d georutex_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - georutex_net

  odoo-test:
    build:
      context: .
      dockerfile: infra/odoo/Dockerfile
    container_name: georutex-odoo-test
    profiles:
      - test
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      HOST: postgres-test
      PORT: 5432
      USER: odoo
      PASSWORD: odoo_test_password
      COVERAGE_FILE: /tmp/.coverage
    volumes:
      - ./addons:/mnt/extra-addons
      - ./tests:/workspace/tests
      - ./pytest.ini:/workspace/pytest.ini
      - ./infra/odoo/odoo.conf:/etc/odoo/odoo.conf
    working_dir: /tmp
    command: python3 -m pytest -c /workspace/pytest.ini /workspace/tests/unit --cov=odoo.addons.uta_transport_monitor.domain --cov=odoo.addons.uta_transport_monitor.integrations --cov-report=term-missing
    networks:
      - georutex_net

networks:
  georutex_net:
    driver: bridge

volumes:
  odoo_db_data:
  odoo_web_data:
  traccar_data:
  traccar_logs:
